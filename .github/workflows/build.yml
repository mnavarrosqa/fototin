name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # La clave de firma vive en los secrets del repo, no en el código.
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.FOTOTIN_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/fototin-release.p12"
            echo "FOTOTIN_KEYSTORE_FILE=$RUNNER_TEMP/fototin-release.p12" >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "::error::Falta el secret FOTOTIN_KEYSTORE_BASE64: no se publica un APK que no se pueda instalar encima del anterior."
            exit 1
          else
            echo "::warning::Sin clave de firma: este APK se firma con la clave de debug."
          fi
      - name: Run tests
        run: ./gradlew testReleaseUnitTest
      - name: Build release APK
        env:
          FOTOTIN_KEYSTORE_PASSWORD: ${{ secrets.FOTOTIN_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fototin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fototin-apk
          path: fototin.apk
      # Cada push a main publica una release; el link .../releases/latest/download/fototin.apk
      # siempre apunta a la última versión.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Fototin 0.2.${{ github.run_number }}
          make_latest: true
          files: fototin.apk
          body: |
            Descargá `fototin.apk` desde el teléfono y abrilo para instalar o actualizar.
