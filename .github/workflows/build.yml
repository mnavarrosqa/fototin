name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk fototin.apk
      - uses: actions/upload-artifact@v4
        with:
          name: fototin-apk
          path: fototin.apk
      # Cada push a main publica una release; el link .../releases/latest/download/fototin.apk
      # siempre apunta a la última versión.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: Fototin 0.2.${{ github.run_number }}
          make_latest: true
          files: fototin.apk
          body: |
            Descargá `fototin.apk` desde el teléfono y abrilo para instalar o actualizar.
